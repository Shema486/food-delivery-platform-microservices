spring.application.name=api-gateway

# Server port
server.port=8080

# JWT configuration
app.jwt.secret=${JWT_SECRET:mysecretkey}

# Eureka Client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway routes
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=customer-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.mvc.routes[2].id=restaurant-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/restaurants/**

spring.cloud.gateway.mvc.routes[3].id=order-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[4].id=delivery-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/deliveries/**