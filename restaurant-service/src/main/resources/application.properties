spring.application.name=restaurant-service

# External service URLs
services.customer.url=http://localhost:8084

# Eureka Client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Server port
server.port=8082

# Database configuration
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# JWT configuration
app.jwt.secret=${JWT_SECRET:mysecretkey}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Feign client configuration
feign.circuitbreaker.enabled=true

# Resilience4j Circuit Breaker configuration for CUSTOMER-SERVICE
resilience4j.circuitbreaker.instances.CUSTOMER-SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.CUSTOMER-SERVICE.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.CUSTOMER-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.CUSTOMER-SERVICE.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.CUSTOMER-SERVICE.permitted-number-of-calls-in-half-open-state=3

# Actuator configuration
propertiesmanagement.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always